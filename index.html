<!DOCTYPE html>
<html lang="ms" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Receipt Tracker AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
/* ================= TEMA ================= */
:root {
  --bg-outer: #e9ecf0;
  --bg-body: #f4f5f7;
  --bg-card: #ffffff;
  --bg-card-light: #eceff3;
  --text-main: #16202e;
  --text-muted: #5f6b7a;
  --primary: #1f4e79;
  --primary-soft: #e3ecf5;
  --on-primary: #ffffff;
  --danger: #b4412f;
  --success: #2f7d5b;
  --border-color: #dde1e7;
  --shadow: 0 1px 2px rgba(22, 32, 46, 0.06);
}
[data-theme='dark'] {
  --bg-outer: #070b10;
  --bg-body: #0e141b;
  --bg-card: #151d27;
  --bg-card-light: #1d2733;
  --text-main: #e6ebf1;
  --text-muted: #8c98a8;
  --primary: #6a9bd1;
  --primary-soft: #1b2b3f;
  --on-primary: #0e141b;
  --danger: #e07b69;
  --success: #5fb58c;
  --border-color: #243040;
  --shadow: none;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s;
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }

body {
  background-color: var(--bg-outer);
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.mobile-wrapper {
  width: 100%;
  max-width: 430px;
  height: 100%;
  max-height: 900px;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-body);
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  color: var(--text-main);
}
@media (max-width: 450px), (max-height: 600px) {
  .mobile-wrapper {
    max-width: 100%;
    max-height: none;
    border: none;
    border-radius: 0;
  }
}

.app-content {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  padding-bottom: 24px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.app-content::-webkit-scrollbar { display: none; }

.view { display: none; padding: 28px 20px 20px; }
.view.active { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-main); }
.subtitle { color: var(--text-muted); font-size: 14px; margin: 4px 0 20px; }

/* ================= IKON ================= */
.ic {
  width: 20px; height: 20px; flex-shrink: 0;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}
.ic-sm { width: 16px; height: 16px; }
.ic-lg { width: 26px; height: 26px; }
.ic-xl { width: 34px; height: 34px; }
.btn .ic, .action-btn .ic { pointer-events: none; }

/* ================= INPUT & BUTANG ================= */
input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  background-color: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  font-size: 16px;
  outline: none;
}
input:focus, select:focus, textarea:focus,
.btn:focus-visible, .nav-item:focus-visible, .action-btn:focus-visible, .icon-opt:focus-visible {
  border-color: var(--primary);
  outline: 2px solid var(--primary);
  outline-offset: 1px;
}
textarea { resize: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  background: var(--bg-card);
  color: var(--text-main);
}
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-block { width: 100%; }

/* ================= HISTORY ================= */
.filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(96px, 128px); gap: 10px; margin-bottom: 18px; }
.search-wrap { position: relative; }
.search-wrap .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
.search-wrap input { padding-left: 38px; }

.receipt-list { display: flex; flex-direction: column; gap: 8px; }
.receipt-item {
  background-color: var(--bg-card);
  padding: 12px 14px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow);
  cursor: pointer;
}
.receipt-item:active { background-color: var(--bg-card-light); }
.receipt-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.receipt-icon {
  width: 40px; height: 40px; flex-shrink: 0;
  background: var(--primary-soft); color: var(--primary);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.receipt-info { min-width: 0; }
.receipt-info h4 {
  font-size: 15px; font-weight: 500; margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.receipt-info p { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.receipt-amount { font-weight: 500; font-size: 15px; white-space: nowrap; margin-left: 10px; font-variant-numeric: tabular-nums; }
.receipt-amount.expense { color: var(--text-main); }
.receipt-amount.income { color: var(--success); }
.empty-msg { text-align: center; color: var(--text-muted); margin-top: 30px; font-size: 14px; line-height: 1.5; }

/* ================= DASHBOARD ================= */
.balance-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-left: 4px solid var(--primary);
  box-shadow: var(--shadow);
  padding: 20px; border-radius: 12px; margin: 16px 0 8px;
}
.balance-card .label { font-size: 13px; color: var(--text-muted); }
.balance-card h2 {
  font-size: 30px; font-weight: 600; margin: 6px 0 18px;
  color: var(--text-main); font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
}
.balance-details { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-top: 1px solid var(--border-color); padding-top: 14px; }
.detail-box:first-child { padding-right: 14px; border-right: 1px solid var(--border-color); }
.detail-box:last-child { padding-left: 14px; }
.detail-box span { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
.detail-box h4 { font-size: 16px; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; }
.detail-box.in span .ic { color: var(--success); }
.detail-box.out span .ic { color: var(--danger); }

.section-title { font-size: 14px; color: var(--text-main); font-weight: 600; margin: 22px 0 10px; }
.bar-row { margin-bottom: 14px; }
.bar-label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 6px; }
.bar-label .name { display: flex; align-items: center; gap: 8px; color: var(--text-main); }
.bar-label .name .ic { color: var(--text-muted); }
.bar-label .amt { font-variant-numeric: tabular-nums; color: var(--text-muted); }
.bar-track { height: 6px; border-radius: 6px; background: var(--bg-card-light); overflow: hidden; }
.bar-fill { height: 100%; background: var(--primary); border-radius: 6px; }

/* ================= UPLOAD ================= */
.scan-info {
  background-color: var(--bg-card);
  padding: 14px; border-radius: 12px;
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 22px; border: 1px solid var(--border-color);
}
.scan-info .badge {
  width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  background: var(--primary-soft); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
}
.scan-info h3 { font-size: 14px; font-weight: 600; }
.scan-info p { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.upload-area {
  border: 1.5px dashed var(--border-color);
  border-radius: 16px; height: 310px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; cursor: pointer;
  background-color: var(--bg-card);
}
.upload-circle {
  width: 76px; height: 76px; background-color: var(--primary-soft); color: var(--primary);
  border-radius: 20px; display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
.upload-area h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
.upload-area p { color: var(--text-muted); font-size: 14px; }
.upload-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.action-btn {
  background-color: var(--bg-card); border: 1px solid var(--border-color);
  color: var(--text-main); padding: 14px 10px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer; font-size: 13px; font-weight: 500;
}
.action-btn .ic { color: var(--primary); }

/* ================= SETTINGS ================= */
.card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 12px; padding: 4px 16px; margin-bottom: 8px; box-shadow: var(--shadow);
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; gap: 10px;
}
.setting-row:last-child { border-bottom: none; }
.setting-row .lead { display: flex; align-items: center; gap: 10px; min-width: 0; }
.setting-row .lead .ic { color: var(--text-muted); }
.setting-row .btn { padding: 8px 12px; font-size: 13px; }
.setting-row select { width: 110px; padding: 8px 10px; font-size: 14px; }
.del {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  padding: 6px; border-radius: 6px; display: flex;
}
.del:hover { color: var(--danger); }
.cat-add { display: grid; gap: 10px; padding: 14px 0; }
.cat-add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.cat-add-row input { padding: 10px 12px; font-size: 15px; }
.cat-add-row .btn { padding: 10px 14px; }
.icon-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.icon-opt {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-color); border-radius: 8px;
  background: var(--bg-card); color: var(--text-muted); cursor: pointer;
}
.icon-opt.active { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
.muted { color: var(--text-muted); font-size: 12px; }

/* ================= SHEET (TAMBAH / EDIT) ================= */
.sheet-overlay {
  position: absolute; inset: 0; background: rgba(15, 23, 36, 0.5);
  z-index: 200; display: none; align-items: flex-end;
}
.sheet-overlay.open { display: flex; }
.sheet {
  width: 100%; max-height: 92%; overflow-y: auto;
  background: var(--bg-body); border-radius: 16px 16px 0 0;
  padding: 20px 20px 30px; animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.sheet-head h2 { font-size: 18px; font-weight: 600; color: var(--text-main); }
.sheet-head button { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; padding: 4px; }
.type-toggle { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-bottom: 14px; }
.type-toggle button {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px; border-radius: 8px; border: 1px solid var(--border-color);
  background: var(--bg-card); color: var(--text-muted); font-weight: 500; cursor: pointer; font-size: 14px;
}
.type-toggle button.active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.image-box {
  border: 1px dashed var(--border-color); border-radius: 12px; padding: 12px;
  margin-bottom: 16px; background: var(--bg-card);
}
.image-box img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; margin-bottom: 10px; display: block; }
.image-box .pdf-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 10px; word-break: break-all; }
.image-box .img-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.image-box .btn { padding: 8px 12px; font-size: 13px; }
.sheet-actions { display: grid; gap: 10px; margin-top: 6px; }

/* ================= TOAST ================= */
.toast {
  position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(20px);
  background: #16202e; color: #fff; padding: 11px 16px; border-radius: 8px;
  font-size: 14px; z-index: 300; opacity: 0; pointer-events: none;
  transition: opacity 0.25s, transform 0.25s; max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ================= BOTTOM NAV ================= */
.bottom-nav {
  flex-shrink: 0;
  width: 100%;
  background-color: var(--bg-card); border-top: 1px solid var(--border-color);
  display: flex; justify-content: space-between; align-items: center; gap: 2px;
  padding: 8px 4px calc(10px + env(safe-area-inset-bottom, 0px));
  position: relative; z-index: 100;
}
.nav-item {
  flex: 1 1 0; min-width: 0;
  background: transparent; border: none; color: var(--text-muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  cursor: pointer; font-size: 11px; font-weight: 500; border-radius: 8px; padding: 2px 0;
}
.nav-item span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item.active { color: var(--primary); }
.scan-icon-wrapper {
  width: 52px; height: 52px; background-color: var(--primary); color: var(--on-primary);
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  position: relative; top: -14px; border: 3px solid var(--bg-card);
}

.acc-form { display: grid; gap: 10px; padding: 14px 0; }
.acc-form .btn { width: 100%; }
.acc-note { font-size: 12px; color: var(--text-muted); line-height: 1.5; padding-bottom: 12px; display: flex; gap: 8px; align-items: flex-start; }
.acc-note .ic { margin-top: 1px; }

/* ================= ANTI-OVERFLOW (zoom / saiz teks) ================= */
input[type='date'], input[type='month'] { -webkit-appearance: none; appearance: none; min-height: 46px; }
input, select, textarea { min-width: 0; max-width: 100%; }
.view, .card, .receipt-item, .setting-row, .detail-box, .field, .scan-info { min-width: 0; }
.view h1, .subtitle, .setting-row span, .scan-info h3, .scan-info p, .empty-msg,
.detail-box h4, .balance-card h2, .bar-label span, .acc-note, .upload-area p { overflow-wrap: anywhere; }
.setting-row { flex-wrap: wrap; }
.setting-row .muted { text-align: right; flex: 1 1 auto; min-width: 0; }
.balance-card h2 { font-size: clamp(22px, 8vw, 30px); }
.receipt-amount { flex-shrink: 0; }
.upload-area { height: auto; min-height: 260px; padding: 24px 16px; }
.btn, .action-btn, .type-toggle button { min-width: 0; max-width: 100%; }
.sheet { overscroll-behavior: contain; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.toast { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }

/* ================= TOGGLE BAHASA ================= */
.seg { display: inline-flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
.seg button {
  border: none; background: var(--bg-card); color: var(--text-muted);
  padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--border-color); }
.seg button.active { background: var(--primary); color: var(--on-primary); }
.seg button:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    </style>

    </svg>

    <div class="mobile-wrapper">
      <div class="app-content" id="app-content">
        <!-- ===== HISTORY ===== -->
        <main id="view-history" class="view active">
          <h1 data-i18n="title_history"></h1>
          <p class="subtitle" id="history-count">0 resit</p>
          <div class="filters">
            <div class="search-wrap">
              <svg class="ic ic-sm"><use href="#i-search" /></svg>
              <input type="text" id="search-input" data-i18n-placeholder="search_ph" />
            </div>
            <select id="filter-cat"></select>
          </div>
          <div class="receipt-list" id="receipt-list"></div>
        </main>

        <!-- ===== DASHBOARD ===== -->
        <main id="view-dashboard" class="view">
          <h1 data-i18n="title_dashboard"></h1>
          <p class="subtitle" data-i18n="dash_sub"></p>
          <input type="month" id="month-input" />
          <header class="balance-card">
            <p class="label" data-i18n="net_balance"></p>
            <h2 id="dash-net">MYR 0.00</h2>
            <div class="balance-details">
              <div class="detail-box in">
                <span><svg class="ic ic-sm"><use href="#i-trend-up" /></svg><span data-i18n="income"></span></span>
                <h4 id="dash-income">MYR 0.00</h4>
              </div>
              <div class="detail-box out">
                <span><svg class="ic ic-sm"><use href="#i-trend-down" /></svg><span data-i18n="expense"></span></span>
                <h4 id="dash-expense">MYR 0.00</h4>
              </div>
            </div>
          </header>
          <div class="section-title" data-i18n="by_category"></div>
          <div id="dash-breakdown"></div>
        </main>

        <!-- ===== UPLOAD / SCAN ===== -->
        <main id="view-upload" class="view">
          <div class="scan-info">
            <div class="badge"><svg class="ic"><use href="#i-scan" /></svg></div>
            <div>
              <h3 data-i18n="add_receipt"></h3>
              <p data-i18n="scan_info_sub"></p>
            </div>
          </div>

          <section class="upload-area" id="scan-btn" onclick="$('file-camera').click()">
            <div class="upload-circle">
              <svg class="ic ic-xl"><use href="#i-camera" /></svg>
            </div>
            <h2 data-i18n="scan_title"></h2>
            <p data-i18n="scan_sub"></p>
          </section>

          <div class="upload-actions">
            <button class="action-btn" onclick="openSheet()">
              <svg class="ic ic-lg"><use href="#i-pencil" /></svg><span data-i18n="manual"></span>
            </button>
            <button class="action-btn" onclick="$('file-gallery').click()">
              <svg class="ic ic-lg"><use href="#i-image" /></svg><span data-i18n="gallery"></span>
            </button>
            <button class="action-btn" onclick="$('file-pdf').click()">
              <svg class="ic ic-lg"><use href="#i-file" /></svg><span>PDF</span>
            </button>
          </div>

          <input type="file" id="file-camera" accept="image/*" capture="environment" hidden />
          <input type="file" id="file-gallery" accept="image/*" hidden />
          <input type="file" id="file-pdf" accept="application/pdf" hidden />
        </main>

        <!-- ===== SETTINGS ===== -->
        <main id="view-settings" class="view">
          <h1 data-i18n="title_settings"></h1>
          <p class="subtitle" data-i18n="settings_sub"></p>

          <div class="section-title" data-i18n="sec_general"></div>
          <div class="card">
            <div class="setting-row">
              <span data-i18n="theme"></span>
              <button class="btn" id="theme-btn" onclick="toggleTheme()"></button>
            </div>
            <div class="setting-row">
              <span data-i18n="language"></span>
              <div class="seg" role="group" aria-label="Language / Bahasa">
                <button type="button" id="lang-ms" onclick="setLang('ms')">BM</button>
                <button type="button" id="lang-en" onclick="setLang('en')">EN</button>
              </div>
            </div>
            <div class="setting-row">
              <span data-i18n="currency"></span>
              <select id="currency-select">
                <option>MYR</option>
                <option>SGD</option>
                <option>USD</option>
                <option>IDR</option>
                <option>EUR</option>
              </select>
            </div>
          </div>

          <div class="section-title" data-i18n="sec_category"></div>
          <div class="card">
            <div id="cat-settings-list"></div>
            <div class="cat-add">
              <div class="icon-picker" id="new-cat-picker"></div>
              <div class="cat-add-row">
                <input type="text" id="new-cat-name" data-i18n-placeholder="new_cat_ph" maxlength="24" />
                <button class="btn btn-primary" onclick="addCategory()" data-i18n="add"></button>
              </div>
            </div>
          </div>

          <div class="section-title" data-i18n="sec_account"></div>
          <div class="card" id="account-box"></div>

          <div class="section-title" data-i18n="sec_data"></div>
          <div class="card">
            <div class="setting-row">
              <span class="lead"><svg class="ic"><use href="#i-download" /></svg><span data-i18n="export_csv"></span></span>
              <button class="btn" onclick="exportCSV()" data-i18n="download"></button>
            </div>
            <div class="setting-row">
              <span class="lead"><svg class="ic"><use href="#i-trash" /></svg><span data-i18n="delete_all"></span></span>
              <button class="btn btn-danger" onclick="deleteAllData()" data-i18n="delete"></button>
            </div>
          </div>
          <p class="muted" id="user-info" style="text-align: center; margin-top: 14px"></p>
        </main>
      </div>

      <!-- ===== SHEET TAMBAH / EDIT ===== -->
      <div class="sheet-overlay" id="sheet" onclick="if (event.target === this) closeSheet()">
        <div class="sheet">
          <div class="sheet-head">
            <h2 id="sheet-title"></h2>
            <button onclick="closeSheet()" data-i18n-aria="close"><svg class="ic"><use href="#i-x" /></svg></button>
          </div>

          <div class="type-toggle">
            <button type="button" id="type-expense" onclick="setType('expense')">
              <svg class="ic ic-sm"><use href="#i-trend-down" /></svg><span data-i18n="expense"></span>
            </button>
            <button type="button" id="type-income" onclick="setType('income')">
              <svg class="ic ic-sm"><use href="#i-trend-up" /></svg><span data-i18n="income"></span>
            </button>
          </div>

          <div class="field">
            <label for="f-merchant" data-i18n="merchant_label"></label>
            <input type="text" id="f-merchant" data-i18n-placeholder="merchant_ph" maxlength="80" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="f-amount" data-i18n="amount_label"></label>
              <input type="number" id="f-amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" />
            </div>
            <div class="field">
              <label for="f-date" data-i18n="date_label"></label>
              <input type="date" id="f-date" />
            </div>
          </div>
          <div class="field">
            <label for="f-category" data-i18n="category_label"></label>
            <select id="f-category"></select>
          </div>
          <div class="field">
            <label for="f-notes" data-i18n="notes_label"></label>
            <textarea id="f-notes" rows="2" maxlength="300"></textarea>
          </div>

          <div class="image-box">
            <div id="image-preview"></div>
            <div class="img-actions">
              <button type="button" class="btn" onclick="$('file-camera').click()"><svg class="ic ic-sm"><use href="#i-camera" /></svg><span data-i18n="camera"></span></button>
              <button type="button" class="btn" onclick="$('file-gallery').click()"><svg class="ic ic-sm"><use href="#i-image" /></svg><span data-i18n="gallery"></span></button>
              <button type="button" class="btn" onclick="$('file-pdf').click()"><svg class="ic ic-sm"><use href="#i-file" /></svg>PDF</button>
              <button type="button" class="btn btn-danger" id="remove-image-btn" onclick="removeImage()"><svg class="ic ic-sm"><use href="#i-trash" /></svg><span data-i18n="remove"></span></button>
            </div>
          </div>

          <div class="sheet-actions">
            <button class="btn btn-primary btn-block" id="save-btn" onclick="saveReceipt()" data-i18n="save"></button>
            <button class="btn btn-danger btn-block" id="delete-btn" onclick="deleteReceipt()" data-i18n="delete_receipt"></button>
          </div>
        </div>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <!-- ===== BOTTOM NAV ===== -->
      <nav class="bottom-nav" id="main-nav">
        <button class="nav-item" data-view="history" onclick="switchView('history')">
          <svg class="ic"><use href="#i-list" /></svg><span data-i18n="title_history"></span>
        </button>
        <button class="nav-item" data-view="dashboard" onclick="switchView('dashboard')">
          <svg class="ic"><use href="#i-chart" /></svg><span data-i18n="title_dashboard"></span>
        </button>
        <button class="nav-item" data-view="upload" onclick="triggerScan()" data-i18n-aria="scan_title">
          <div class="scan-icon-wrapper"><svg class="ic ic-lg"><use href="#i-camera" /></svg></div>
        </button>
        <button class="nav-item" onclick="openSheet()">
          <svg class="ic"><use href="#i-plus" /></svg><span data-i18n="add"></span>
        </button>
        <button class="nav-item" data-view="settings" onclick="switchView('settings')">
          <svg class="ic"><use href="#i-sliders" /></svg><span data-i18n="title_settings"></span>
        </button>
      </nav>
    </div>

    <script src="script.js"></script>
  </body>
</html>
